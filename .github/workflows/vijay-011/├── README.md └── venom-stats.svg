
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="342" viewBox="0 0 800 342">
  <defs>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="342" rx="171" fill="#050505"/>
  <rect x="5" y="5" width="790" height="332" rx="166"
        fill="none" stroke="#8b5cf6" stroke-width="2.5"/>

  <!-- Venom-inspired eyes -->
  <path d="M45 45 Q95 20 150 45 L110 85 Q75 80 45 45Z"
        fill="white" filter="url(#glow)"/>
  <path d="M150 45 Q205 20 255 45 Q225 80 190 85Z"
        fill="white" filter="url(#glow)"/>

  <!-- Heading -->
  <text x="400" y="57" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="27" font-weight="900" letter-spacing="6"
        fill="#ffffff">VENOM</text>

  <text x="400" y="82" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11" font-weight="700" letter-spacing="4"
        fill="#c4b5fd">VIJAY'S PROFILE SKILLS</text>

  <!-- Skill names -->
  <g font-family="Arial, Helvetica, sans-serif"
     font-size="12" font-weight="700" fill="#ffffff">
    <text x="75" y="125">SOFTWARE DEVELOPMENT</text>
    <text x="75" y="163">ARTIFICIAL INTELLIGENCE</text>
    <text x="75" y="201">UI / UX DESIGN</text>
    <text x="75" y="239">CREATIVE TECHNOLOGY</text>
    <text x="75" y="277">EXPERIMENTAL PROJECTS</text>
  </g>

  <!-- Background bars -->
  <g fill="#292333">
    <rect x="300" y="113" width="340" height="8" rx="4"/>
    <rect x="300" y="151" width="340" height="8" rx="4"/>
    <rect x="300" y="189" width="340" height="8" rx="4"/>
    <rect x="300" y="227" width="340" height="8" rx="4"/>
    <rect x="300" y="265" width="340" height="8" rx="4"/>
  </g>

  <!-- Skill bars -->
  <g fill="url(#purple)" filter="url(#glow)">
    <rect x="300" y="113" width="292" height="8" rx="4"/>
    <rect x="300" y="151" width="265" height="8" rx="4"/>
    <rect x="300" y="189" width="245" height="8" rx="4"/>
    <rect x="300" y="227" width="275" height="8" rx="4"/>
    <rect x="300" y="265" width="255" height="8" rx="4"/>
  </g>

  <!-- Percentages -->
  <g font-family="Arial, Helvetica, sans-serif"
     font-size="11" font-weight="700" fill="#c4b5fd"
     text-anchor="end">
    <text x="675" y="121">86%</text>
    <text x="675" y="159">78%</text>
    <text x="675" y="197">72%</text>
    <text x="675" y="235">81%</text>
    <text x="675" y="273">75%</text>
  </g>

  <text x="400" y="310" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="10" font-weight="700" letter-spacing="3"
        fill="#a78bfa">WE ARE VENOM</text>
</svg>
