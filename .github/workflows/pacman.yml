

name: Generate Purple Pac-Man Animation

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: vijay-011
          games: pacman

      - name: Apply Purple Venom Colors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          colors = {
              "#0e4429": "#2E0854",
              "#006d32": "#4C1D95",
              "#26a641": "#7B2CBF",
              "#39d353": "#B57EDC",
              "#ebedf0": "#E0AAFF",
              "#161b22": "#0D0718",
          }

          for file in Path("dist").rglob("*.svg"):
              content = file.read_text()

              for old, new in colors.items():
                  content = content.replace(old, new)
                  content = content.replace(old.upper(), new)

              file.write_text(content)
              print(f"Updated colors in {file}")
          PY

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


