

name: Generate Purple Pac-Man Animation

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: vijay-011
          games: pacman

      - name: Apply Purple Venom Colors
        run: |
          find dist -name "*.svg" -type f -exec sed -i \
            -e 's/#0d1117/#0D0718/g' \
            -e 's/#161b22/#2E0854/g' \
            -e 's/#0e4429/#4C1D95/g' \
            -e 's/#006d32/#7B2CBF/g' \
            -e 's/#26a641/#B57EDC/g' \
            -e 's/#39d353/#E0AAFF/g' \
            {} +

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

