
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="342" viewBox="0 0 800 342">
  <defs>
    <linearGradient id="venomGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="purpleBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="capsuleClip">
      <rect x="8" y="8" width="784" height="326" rx="163"/>
    </clipPath>
  </defs>

  <!-- Capsule background -->
  <rect x="8" y="8" width="784" height="326" rx="163"
        fill="#050505" stroke="#8b5cf6" stroke-width="3"/>

  <rect x="15" y="15" width="770" height="312" rx="156"
        fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>

  <g clip-path="url(#capsuleClip)">
    <!-- Subtle symbiote tendrils -->
    <path d="M0 65 C90 25 115 115 185 70 S260 35 300 90"
          fill="none" stroke="#7c3aed" stroke-opacity="0.25" stroke-width="3"/>
    <path d="M800 275 C720 310 700 220 630 265 S550 300 510 250"
          fill="none" stroke="#a78bfa" stroke-opacity="0.2" stroke-width="3"/>

    <!-- Venom-inspired eyes -->
    <path d="M62 62 C88 43 120 45 145 61 L112 91 C91 87 75 77 62 62Z"
          fill="#ffffff" filter="url(#glow)"/>
    <path d="M145 61 C170 45 202 43 228 62 C215 77 199 87 178 91Z"
          fill="#ffffff" filter="url(#glow)"/>

    <!-- Title -->
    <text x="400" y="67" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="25" font-weight="900" letter-spacing="7"
          fill="#ffffff">VENOM</text>

    <text x="400" y="91" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="10" font-weight="700" letter-spacing="4"
          fill="#c4b5fd">PROFILE SKILLS</text>

    <!-- Skill labels -->
    <g font-family="Arial, Helvetica, sans-serif"
       font-size="12" font-weight="700" fill="#f5f3ff">

      <text x="75" y="125">SOFTWARE DEVELOPMENT</text>
      <text x="75" y="163">ARTIFICIAL INTELLIGENCE</text>
      <text x="75" y="201">UI / UX DESIGN</text>
      <text x="75" y="239">CREATIVE TECHNOLOGY</text>
      <text x="75" y="277">EXPERIMENTAL PROJECTS</text>
    </g>

    <!-- Progress track -->
    <g fill="#24202d">
      <rect x="300" y="113" width="340" height="8" rx="4"/>
      <rect x="300" y="151" width="340" height="8" rx="4"/>
      <rect x="300" y="189" width="340" height="8" rx="4"/>
      <rect x="300" y="227" width="340" height="8" rx="4"/>
      <rect x="300" y="265" width="340" height="8" rx="4"/>
    </g>

    <!-- Purple / white skill bars -->
    <g fill="url(#purpleBar)" filter="url(#glow)">
      <rect x="300" y="113" width="292" height="8" rx="4"/>
      <rect x="300" y="151" width="265" height="8" rx="4"/>
      <rect x="300" y="189" width="245" height="8" rx="4"/>
      <rect x="300" y="227" width="275" height="8" rx="4"/>
      <rect x="300" y="265" width="255" height="8" rx="4"/>
    </g>

    <!-- Percentages -->
    <g font-family="Arial, Helvetica, sans-serif"
       font-size="11" font-weight="700" fill="#c4b5fd"
       text-anchor="end">
      <text x="675" y="121">86%</text>
      <text x="675" y="159">78%</text>
      <text x="675" y="197">72%</text>
      <text x="675" y="235">81%</text>
      <text x="675" y="273">75%</text>
    </g>

    <!-- Bottom caption -->
    <text x="400" y="307" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="10" font-weight="700" letter-spacing="3"
          fill="#a78bfa">WE ARE VENOM</text>
  </g>
</svg>
